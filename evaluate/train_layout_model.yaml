artifact:
  # One train-only PPO checkpoint. Package artifacts are produced later by
  # evaluate/test_layout_scalability.py after loading this model.
  run_name: layout-rl-1000x200_seed52
  model_root: ./result/layout_models
  output_model_path: null

schema:
  # Keep this canvas in the training config, not in QuNoCEnv's global defaults.
  # It covers the default 40x40-160x160 training shapes and leaves room for
  # long rectangular shapes that can be appended in domain.package_shapes.
  canvas_size: [1000, 200]
  max_module_slots: 2048
  relative_interval_bins: [0.08, 0.12, 0.16, 0.22, 0.30, 0.40]

environment:
  chiplet_length: 10
  # Minimum fraction of the initial compute region preserved during RL layout generation.
  compute_ratio: 0.8
  patience: 5
  invalid_action_penalty: -2.0

scoring:
  score_seed: 52
  score_seeds: [52]
  estimate_workers_per_env: 1

domain:
  # Square packages from 40x40 to 160x160 plus fixed-area rectangular shapes.
  package_shapes:
    - 40
    - 60
    - 80
    - 100
    - 120
    - 140
    - 160
    - [1000, 10]
    - [500, 20]
    - [250, 40]
    - [200, 50]
    - [125, 80]
  chiplet_length: 10
  fab_model:
    compute_geometry: square
    inter_sparsity: 3
    inter_fide: 0.983
    single_fide: 0.999
    enhanced_fide: 0.9983913300169101
    yield_5: 0.99
    yield_decay: 2
    intra_fide_dict:
      27: 0.993
      65: 0.989
      127: 0.988

  # One-factor training conditions aligned with test_layout_scalability.yaml.
  # Each entry overrides fab_model and becomes one additional fabrication case;
  # entries are not combined with each other. The base fab_model already covers
  # square / inter_sparsity=3 / inter_fide=0.983.
  fab_model_variants:
    # Geometry sweep: [square, hexagon, heavy_square, heavy_hexagon].
    - compute_geometry: hexagon
    - compute_geometry: heavy_square
    - compute_geometry: heavy_hexagon
    # Inter-fidelity sweep: [0.96, 0.965, 0.97, 0.975, 0.98, 0.985, 0.99].
    - inter_fide: 0.96
    - inter_fide: 0.965
    - inter_fide: 0.97
    - inter_fide: 0.975
    - inter_fide: 0.98
    - inter_fide: 0.985
    - inter_fide: 0.99
    # Chiplet-sparsity sweep: [1, 3, 5, 7].
    - inter_sparsity: 1
    - inter_sparsity: 5
    - inter_sparsity: 7

ppo:
  seed: 52
  target_timesteps: 262144
  learning_rate: 0.0003
  # With one worker the rollout size is n_steps, so keep n_steps >= batch_size
  # to make the default config runnable even when auto CPU allocation picks 1 env.
  n_steps: 32
  batch_size: 32
  ent_coef: 0.01

workers:
  num_envs: auto
  num_envs_min: 1
  num_envs_max: 8
  cpu_reserve: 32
  cpu_sample_seconds: 0.25
  memory_per_worker_mb: 2048
  start_method: forkserver

resume:
  continue_training: true
  resume_from_checkpoint: true
  checkpoint_enabled: true
  checkpoint_interval_timesteps: 4096
  initial_model_path: null
  overwrite: false
