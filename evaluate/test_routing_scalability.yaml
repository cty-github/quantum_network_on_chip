defaults:
  # layout_root_dir: ./result/layout_scalability
  quantum_programs: [vqe, qaoa, bv, s_ghz]
  layout_design_strategy: rl
  # package_size: [100, 100]
  # package_area: 10000
  # fab_model:
  #   compute_geometry: square
  #   inter_sparsity: 3
  #   inter_fide: 0.983
  reuse_result: false  # Recompute statistics; compatible saved circuits are reused.
  # statistics_only: true  # Require saved circuit + matching metadata; never compile.
  # recompile: true  # Explicitly force fresh routing instead (mutually exclusive).
  # Full staged QuNoC routes only; MECH/dummy ablation remains legacy.
  eqst:
    model: legacy  # Set hamiltonian to enable staged Hamiltonian EQST.
    # Unspecified calibration/planner values retain package settings, or defaults
    # below for old packages. All times are ns; g_max is rad/ns.
    # reference_time_ns: 125
    # reference_distance: 5
    # No fixed edge cap; assume requested couplings are available / 不设固定边耦合上限，假定所需耦合可实现。
    g_max: null
    coupling_policy: preserve-request  # Preserve sqrt-distance pulse times / 保持单区间根号距离时序。
    # max_segment_steps: 10
    # beam_width: 128
  routing:
    route_strategy: immediate
    mapping_strategy: random
    block_strategy: cost_based
    ghz_source_strategy: neighbor_median
    ghz_pairing_strategy: greedy
  program_routing:
    vqe:
      block_strategy: legacy
    qaoa:
      block_strategy: prefer_tele
      tele_platform_strategy: nearest
      gate_select_strategy: max_fanout
      gate_order_strategy: control_grouped
    bv:
      block_strategy: legacy
    s_ghz:
      block_strategy: prefer_tele
  program_options:
    qaoa:
      # A cycle graph is a valid QAOA problem instance with locality and depth
      # characteristics that fit the QuNoC teleportation routing flow.
      problem_graph: QAOAcycle
      seed: 52
      order_strategy: control_grouped

