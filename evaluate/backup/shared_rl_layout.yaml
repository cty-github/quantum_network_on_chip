# Legacy shared-RL config. Prefer evaluate/train_layout_model.yaml for train-only
# checkpoints, then set rl_model_path in evaluate/test_layout_scalability.yaml.
shared_rl:
  # One PPO checkpoint is jointly trained on all sizes, then frozen and used
  # for deterministic inference once per package size.
  run_name: sizes40-60-80-100-120_seed42
  # The shared model is stored under exp_dir/shared_rl/<run_name>/.
  # Inferred packages keep normal strategy paths: 40_rl/, ..., 120_rl/.
  exp_dir: ./result/layout_scalability/package_size
  package_sizes: [40, 60, 80, 100, 120]

  chiplet_length: 10
  compute_ratio: 0.8
  patience: 5
  fab_model:
    compute_geometry: square
    inter_sparsity: 3
    inter_fide: 0.983

  canvas_size: [120, 120]
  max_module_slots: 512
  relative_interval_bins: [0.08, 0.12, 0.16, 0.22, 0.30, 0.40]
  invalid_action_penalty: -2.0

  seed: 42
  score_seed: 42
  score_seeds: [41, 42, 43]
  inference_seed: 1042

  train_timesteps: 65536
  continue_training: true
  learning_rate: 0.0003
  n_steps: 32
  batch_size: 32
  ent_coef: 0.01

  # `auto` samples current per-CPU idleness once at launch. It respects
  # process affinity, cgroup quota and SLURM_CPUS_PER_TASK. The number of
  # workers remains fixed for that PPO run, as required by SB3.
  num_envs: auto
  num_envs_min: 1
  num_envs_max: 80
  cpu_reserve: 32
  cpu_sample_seconds: 0.25
  start_method: forkserver

  # Training workers always score serially to avoid nested multiprocessing.
  # This value applies only to final single-process inference.
  inference_estimate_workers: 32

  save_package: true
  save_figure: false
