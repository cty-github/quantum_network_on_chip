# Legacy inline-RL config. Prefer evaluate/train_layout_model.yaml for training,
# then set defaults.rl_model_path in evaluate/test_layout_scalability.yaml for design.
exp_dir: ./result/layout_scalability
log_filename: log
output_csv: output.csv

defaults:
  chiplet_length: 10
  design_strategy: rl
  compute_ratio: 0.8
  rl_patience: 5
  rl_train_timesteps: 16384
  rl_estimate_workers: 1
  rl_seed: 42
  rl_score_seed: 42
  rl_score_seeds: [42]
  rl_canvas_size: [120, 120]
  rl_max_module_slots: 2048
  rl_relative_interval_bins: [0.08, 0.12, 0.16, 0.22, 0.30, 0.40]
  rl_allow_legacy_model: false
  rl_invalid_action_penalty: -2.0
  rl_learning_rate: 0.0003
  rl_n_steps: 32
  rl_batch_size: 64
  rl_ent_coef: 0.01
  rl_num_envs: 32
  continue_training: true
  reuse_package: false
  save_package: true
  save_figure: false
  reuse_agent: false
  fab_model:
    compute_geometry: square
    inter_sparsity: 3
    inter_fide: 0.983

experiments:
  package_size:
    exp_dir: ./result/layout_scalability/package_size
    output_csv: output.csv
    defaults:
      package_size: [100, 100]
    scalability:
      design_strategy_to_test: [rl]
      package_size_to_test: [100]
