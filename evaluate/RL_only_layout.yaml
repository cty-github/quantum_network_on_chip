exp_dir: ./result/layout_scalability
log_filename: log
output_csv: output.csv

defaults:
  chiplet_length: 10
  design_strategy: rl
  compute_ratio: 0.8
  rl_patience: 5
  rl_train_timesteps: 4096
  rl_estimate_workers: 8
  reuse_package: true
  save_package: true
  save_figure: true
  reuse_agent: true
  fab_model:
    compute_geometry: square
    inter_sparsity: 3
    inter_fide: 0.983

experiments:
  package_size:
    exp_dir: ./result/layout_scalability/package_size
    output_csv: output.csv
    defaults:
      package_size: [100, 100]
    scalability:
      design_strategy_to_test: [greedy, rl]
      package_size_to_test: [100]